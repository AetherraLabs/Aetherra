[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aetherra"
version = "0.5.0-beta.0"
description = "AI-native development environment with intelligent workflows and persistent memory"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Aetherra Labs and Contributors", email = "contact@aetherra.dev"}
]
maintainers = [
    {name = "Aetherra Labs", email = "contact@aetherra.dev"}
]
keywords = [
    "ai", "automation", "workflow", "memory", "quantum", "development", "assistant"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
requires-python = ">=3.11"
dependencies = [
    "flask>=2.3.0",
    "requests>=2.31.0",
    "prometheus-client>=0.19.0",
    "pyyaml>=6.0",
    "cryptography>=41.0.0",
    "numpy>=1.24.0",
    "qiskit>=1.0.0",
    "qiskit-aer>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.1.0",
    "coverage[toml]>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
    "bandit[toml]>=1.7.0",
    "safety>=2.3.0",
    "pip-audit>=2.6.0",
]
gui = [
    "tkinter",
    "matplotlib>=3.7.0",
    "plotly>=5.15.0",
    "dash>=2.10.0",
]
quantum = [
    "qiskit[all]>=1.0.0",
    "cirq>=1.2.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.1.0",
    "mkdocs-mermaid2-plugin>=1.0.0",
]

[project.urls]
"Homepage" = "https://aetherra.dev"
"Documentation" = "https://docs.aetherra.dev"
"Repository" = "https://github.com/AetherraLabs/Aetherra"
"Bug Tracker" = "https://github.com/AetherraLabs/Aetherra/issues"
"Changelog" = "https://github.com/AetherraLabs/Aetherra/blob/main/CHANGELOG.md"

[project.scripts]
aetherra = "aetherra_os_launcher:main"
lyrixa = "Aetherra.lyrixa.lyrixa_basic:main"
aether = "aether:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["Aetherra*", "aetherra*"]
exclude = ["tests*", "*.tests*", "*.tests"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "*.yaml", "*.yml", "*.json", "*.aether"]

# Testing Configuration
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests", "integration_tests"]
python_files = ["test_*.py", "*_test.py", "tests.py"]
python_classes = ["Test*", "*Tests"]
python_functions = ["test_*"]

addopts = [
    "-v",
    "-l",
    "-ra",
    "--cov=Aetherra",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=70",
    "--cov-branch",
    "--doctest-modules",
    "--doctest-ignore-import-errors",
    "--durations=10",
    "--strict-markers",
    "--tb=short",
]

markers = [
    "asyncio: Asynchronous tests using asyncio",
    "unit: Unit tests for individual components",
    "integration: Integration tests for component interactions",
    "e2e: End-to-end tests for complete workflows",
    "slow: Tests that take a significant amount of time",
    "fast: Quick tests that run in under 1 second",
    "memory: Tests related to memory systems",
    "agents: Tests for agent functionality",
    "api: API endpoint tests",
    "quantum: Quantum computing integration tests",
    "security: Security and authentication tests",
    "smoke: Basic smoke tests for deployment verification",
    "critical: Critical path tests that must always pass",
]

filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::ImportWarning",
    "ignore:.*deprecated.*:DeprecationWarning",
]

# Coverage Configuration
[tool.coverage.run]
source = ["Aetherra"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*_test.py",
    "*/setup.py",
    "*/conftest.py",
    "*/migrations/*",
    "*/venv/*",
    "*/.venv/*",
    "*/build/*",
    "*/dist/*",
    "*/__pycache__/*",
    "*/node_modules/*",
    "*/unused/*",
    "*/backup*/*",
    "*/old*/*",
    "*/legacy*/*"
]
branch = true
parallel = true

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]
sort = "Cover"

[tool.coverage.html]
directory = "htmlcov"
title = "Aetherra Test Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"

# Code Formatting and Linting
[tool.black]
line-length = 88
target-version = ['py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | node_modules
  | frontend/Lib
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["aetherra", "Aetherra"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
import_heading_stdlib = "Standard library imports"
import_heading_thirdparty = "Third party imports"
import_heading_firstparty = "Aetherra imports"
import_heading_localfolder = "Local imports"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [
    "__pycache__",
    "build",
    "dist",
    "node_modules",
    "frontend/Lib",
    # Short-term: exclude deprecated/inactive GUI modules and GUI tests
    "Aetherra/lyrixa/gui",
    "Aetherra/lyrixa/plugins/*_ui.py",
    "Aetherra/plugins/extra_plugins/*_gui.py",
    "tests/gui",
    "tests/ai/test_neural_interface.py",
    "demos/demo_intelligent_error_handler_8.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "N",   # pep8-naming
    "S",   # flake8-bandit (security)
    "T20", # flake8-print
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "S101",  # use of assert (OK in tests)
    "S603",  # subprocess call (OK for tools)
    "T201",  # print statements (OK for CLI tools)
    "ANN201", # missing return type annotation for public function
    "ANN202", # missing return type annotation for private function
    "ANN001", # missing type annotation for function argument
    "ANN002", # missing type annotation for *args
    "ANN003", # missing type annotation for **kwargs
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S107", "ANN201", "ANN202", "F401"]  # Security, annotation, and unused-import checks relaxed in tests
"tools/**/*.py" = ["T201", "S603", "S607"]         # Print and subprocess OK in tools
"Aetherra/**/*.py" = ["UP006", "UP035", "UP045"]     # Temporarily ignore deprecated typing modernizations
"Aetherra/aetherra_core/memory/lightweight_memory_core.py" = ["T201"]  # allow print in console demo

# Back-compat for older Ruff versions (<0.3) that read per-file-ignores from [tool.ruff.per-file-ignores]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = false
strict_equality = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "qiskit.*",
    "cirq.*",
    "prometheus_client.*",
    "requests.*",
    "flask.*",
    "numpy.*",
    "matplotlib.*",
    "plotly.*",
    "dash.*",
]
ignore_missing_imports = true

# Security Scanning
[tool.bandit]
exclude_dirs = ["tests", "node_modules", "frontend/Lib"]
skips = ["B101", "B601"]  # Skip assert_used and shell injection (handled separately)

[tool.bandit.assert_used]
skips = ["**/test_*.py", "**/*_test.py"]  # Allow asserts in tests
