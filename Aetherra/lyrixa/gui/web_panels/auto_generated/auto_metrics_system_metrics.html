<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Generated Panel: auto_metrics_system_metrics</title>
    <link rel="stylesheet" href="../assets/style.css">
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <style>
        .auto-panel {
            margin: 1rem;
            padding: 1rem;
            border: 1px solid var(--aetherra-border);
            border-radius: 8px;
            background: var(--aetherra-dark);
        }

        .panel-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .panel-icon {
            font-size: 1.5rem;
        }

        .status-badge {
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-left: auto;
        }

        .status-badge.active {
            background: var(--aetherra-green);
            color: black;
        }

        .status-badge.idle {
            background: var(--aetherra-yellow);
            color: black;
        }

        .status-badge.error {
            background: var(--aetherra-red);
            color: white;
        }

        .capabilities {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
            margin: 0.5rem 0;
        }

        .capability-tag {
            background: var(--aetherra-purple);
            color: white;
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-size: 0.7rem;
        }

        .meta-item, .stat-item {
            display: flex;
            justify-content: space-between;
            margin: 0.25rem 0;
        }

        .actions {
            margin-top: 1rem;
            display: flex;
            gap: 0.5rem;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .metric-card {
            text-align: center;
            padding: 0.5rem;
            border: 1px solid var(--aetherra-border);
            border-radius: 4px;
        }

        .metric-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--aetherra-green);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--aetherra-gray-dark);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: var(--aetherra-green);
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    
<div class="auto-panel metrics-panel" data-component="System Metrics" data-type="metrics">
    <div class="panel-header">
        <div class="panel-icon">📊</div>
        <h3>System Metrics</h3>
        <span class="status-badge active">active</span>
    </div>
    <div class="panel-content">
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-value">45.9%</div>
                <div class="metric-label">CPU Usage</div>
            </div>
            <div class="metric-card">
                <div class="metric-value">79.2%</div>
                <div class="metric-label">Memory Usage</div>
            </div>
            <div class="metric-card">
                <div class="metric-value">290</div>
                <div class="metric-label">Processes</div>
            </div>
            <div class="metric-card">
                <div class="metric-value">80.7%</div>
                <div class="metric-label">Disk Usage</div>
            </div>
        </div>
    </div>
</div>


    <script>
        // Panel interaction handlers
        function handlePluginAction(pluginName, action) {
            if (window.bridge) {
                window.bridge.handlePanelCommand(JSON.stringify({
                    type: 'plugin_action',
                    payload: { plugin: pluginName, action: action }
                }));
            }
        }

        function handleAgentAction(agentName, action) {
            if (window.bridge) {
                window.bridge.handlePanelCommand(JSON.stringify({
                    type: 'agent_command',
                    payload: { agent: agentName, action: action }
                }));
            }
        }

        function handleMemoryAction(action) {
            if (window.bridge) {
                window.bridge.handlePanelCommand(JSON.stringify({
                    type: 'memory_query',
                    payload: { action: action }
                }));
            }
        }

        function handleServiceAction(serviceName, action) {
            if (window.bridge) {
                window.bridge.handlePanelCommand(JSON.stringify({
                    type: 'system_command',
                    payload: { service: serviceName, action: action }
                }));
            }
        }

        // Connect to Qt bridge
        new QWebChannel(qt.webChannelTransport, function(channel) {
            window.bridge = channel.objects.bridge;
        });
    </script>
</body>
</html>
