[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aetherra"
version = "0.5.0-beta.0"
description = "AI-Native Development Platform with Aetherra language and Lyrixa assistant"
authors = [
    {name = "Aetherra Development Team"}
]
license = {text = "GPL-3.0-or-later"}
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.7.0",
    "requests>=2.28.0",
    "pyyaml>=6.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "isort>=5.12.0",
    "ruff>=0.4.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
]
gui = [
    "PySide6>=6.4.0",
]
crypto = [
    "PyNaCl>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/aetherra/aetherra"
Repository = "https://github.com/aetherra/aetherra"
Documentation = "https://aetherra.readthedocs.io"

[project.scripts]
aetherra = "Aetherra.cli:main"
lyrixa = "Aetherra.ui.enhanced_lyrixa:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["Aetherra*"]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 100
combine_as_imports = true

[tool.ruff]
line-length = 100
target-version = "py38"
exclude = [
    ".venv",
    "venv",
    "build",
    "dist",
    "node_modules",
]

[tool.ruff.lint]
select = ["E","F","I","UP","B","SIM","Q"]
ignore = ["E501"]

[tool.ruff.lint.flake8-tidy-imports]
# Enforce migration away from legacy module namespaces
banned-module-level-imports = {
    "aetherra_core" = "Use Aetherra.* namespace instead of legacy aetherra_core.*",
    "lyrixa_core" = "Use Aetherra.* namespace instead of legacy lyrixa_core.*",
}

[tool.ruff.lint.per-file-ignores]
"Aetherra/aetherra_core/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
