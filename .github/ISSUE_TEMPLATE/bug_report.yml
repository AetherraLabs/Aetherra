name: Bug Report
description: Report a reproducible problem in the project
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please search existing issues first.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Short, clear, actionable description of the bug.
      placeholder: Parser crashes on workflow with nested steps
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, invocation (CLI flags), commit SHA if known.
      placeholder: |
        OS: Windows 11
        Python: 3.12.3
        Command: python aether.py my_workflow.aether --check --json-status
        Commit: abc1234
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction Steps
      description: Exact minimal steps or script to reproduce the problem.
      placeholder: |
        1. Run ...
        2. Observe ...
        3. Error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you thought would happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior / Logs
      description: Paste full traceback, structured JSON output, or relevant console logs (redact secrets).
    validations:
      required: true
  - type: textarea
    id: baseline
    attributes:
      label: Baseline / Prior Behavior
      description: Did this work in a prior version? If so, which? Any recent changes you suspect?
  - type: textarea
    id: mitigation
    attributes:
      label: Temporary Workaround
      description: Any workaround you found (optional).
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-Submission Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I can reproduce this with the latest main branch.
          required: true
        - label: I provided complete reproduction steps and logs.
          required: true
        - label: I am willing to submit a PR to help fix this.
          required: false
