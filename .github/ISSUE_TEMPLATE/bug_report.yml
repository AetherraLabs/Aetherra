name: Bug Report
description: Report an observed defect, including intermittent or historical failures
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues and the [Development Issue Register](https://github.com/AetherraLabs/Aetherra/blob/main/docs/DEVELOPMENT_ISSUES.md) first.
        Preserve historical failures; passing reruns alone do not establish their cause.
        Report vulnerabilities privately through [SECURITY.md](https://github.com/AetherraLabs/Aetherra/blob/main/SECURITY.md).
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Short, clear, actionable description of the bug.
      placeholder: Parser crashes on workflow with nested steps
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, environment/profile, invocation and observed source revision; state what is unknown.
      placeholder: |
        OS: Windows 11
        Python: 3.12.3
        Command: python aether.py my_workflow.aether --check --json-status
        Commit: abc1234
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction / Retained Evidence
      description: Exact steps or retained failure evidence; distinguish current reproduction, intermittent observations and unverified causes.
      placeholder: |
        1. Run ...
        2. Observe ...
        3. Error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you thought would happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior / Logs
      description: Provide sanitized outcomes, exit codes and receipt/log links; retain failures and state skips, limitations and unknowns. Exclude secrets and private conversations.
    validations:
      required: true
  - type: textarea
    id: baseline
    attributes:
      label: Baseline / Prior Behavior
      description: Did this work in a prior version? If so, which? Any recent changes you suspect?
  - type: textarea
    id: mitigation
    attributes:
      label: Temporary Workaround
      description: Any workaround you found (optional).
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-Submission Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I identified the observed source revision and stated whether reproduction on current main was attempted and its actual result.
          required: true
        - label: I provided available reproduction steps or retained failure evidence and stated any gaps.
          required: true
        - label: I am willing to submit a PR to help fix this.
          required: false
  - type: checkboxes
    id: spec_tests
    attributes:
      label: Spec→Tests Gate Impact
      description: Indicate test and validation scope for the fix
      options:
        - label: This bug fix requires new or updated tests to prevent regression
          required: false
        - label: This bug affects documented behavior (docs need updates)
          required: false
        - label: This bug impacts metrics, observability, or monitoring
          required: false
        - label: This bug has security implications (capabilities, auth, tokens)
          required: false
