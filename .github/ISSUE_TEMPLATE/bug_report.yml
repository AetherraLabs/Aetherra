name: Bug report
description: File a bug report
labels: [bug]
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: dropdown
    id: area
    attributes:
      label: Beta focus area
      description: Which roadmap focus area does this bug impact?
      options:
        - stability
        - observability
        - security
        - dx
        - plugins
        - memory
        - federation-prep
        - docs
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps to reproduce the behavior.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: What is the severity (data loss, crash, degraded UX, cosmetic)? Include frequency.
  - type: input
    id: version
    attributes:
      label: Aetherra version/commit
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows
        - macOS
        - Linux
  - type: textarea
    id: logs
    attributes:
      label: Logs/screenshots
      description: Paste any relevant logs or screenshots.
  - type: textarea
    id: mitigation
    attributes:
      label: Temporary mitigation
      description: Any workaround you found (if none, leave blank).
