name: Feature Request
description: Suggest an enhancement or new capability
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Provide context and a clear problem statement. Avoid mixing multiple unrelated features.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: One-line concise description.
      placeholder: Support semantic-release automated version bump
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / Use Case
      description: What problem are you trying to solve? Why is it important?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the solution you would like, including flags, config keys, UX examples.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches or workarounds you evaluated.
  - type: textarea
    id: risks
    attributes:
      label: Risks / Trade-offs
      description: Complexity, performance, security, maintenance considerations.
  - type: textarea
    id: steps
    attributes:
      label: Implementation Sketch (Optional)
      description: Pseudocode, data structures, migration steps.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission Checklist
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: This request is focused and not a bundle of unrelated changes.
          required: true
        - label: I would be willing to help implement this.
          required: false
