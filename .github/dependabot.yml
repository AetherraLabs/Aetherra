version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      prod-deps:
        applies-to: version-updates
        patterns:
          - "aetherra*"
          - "openai*"
          - "anthropic*"
      tooling:
        applies-to: version-updates
        patterns:
          - "pytest*"
          - "ruff*"
          - "black*"
          - "isort*"
          - "mypy*"
          - "flake8*"
          - "python-semantic-release*"
      security-fixes:
        applies-to: security-updates
        patterns:
          - "*"
    open-pull-requests-limit: 8
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies]
  - package-ecosystem: npm
    directory: "/Aetherra/lyrixa/gui"
    schedule:
      interval: weekly
    groups:
      runtime-observatory:
        applies-to: version-updates
        patterns:
          - "react*"
          - "vite*"
          - "webpack*"
      runtime-observatory-tooling:
        applies-to: version-updates
        patterns:
          - "eslint*"
          - "typescript*"
          - "jest*"
  - package-ecosystem: npm
    directory: "/Aetherra/aetherra_hub/aetherra_hub"
    schedule:
      interval: weekly
    groups:
      hub-runtime:
        applies-to: version-updates
        patterns:
          - "express*"
          - "cors"
          - "helmet"
          - "multer"
      hub-tooling:
        applies-to: version-updates
        patterns:
          - "eslint*"
          - "jest*"
          - "nodemon"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: [ci, dependencies]
    commit-message:
      prefix: chore
      include: scope
