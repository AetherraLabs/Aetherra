version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      prod-deps:
        applies-to: version-updates
        patterns:
          - "aetherra*"
          - "openai*"
          - "anthropic*"
      tooling:
        applies-to: version-updates
        patterns:
          - "pytest*"
          - "ruff*"
          - "black*"
          - "isort*"
          - "mypy*"
          - "flake8*"
          - "python-semantic-release*"
      security-fixes:
        applies-to: security-updates
        patterns:
          - "*"
    open-pull-requests-limit: 8
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies]
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    groups:
      ui-runtime:
        applies-to: version-updates
        patterns:
          - "react*"
          - "vite*"
          - "webpack*"
      ui-tooling:
        applies-to: version-updates
        patterns:
          - "eslint*"
          - "typescript*"
          - "jest*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: [ci, dependencies]
    commit-message:
      prefix: chore
      include: scope
