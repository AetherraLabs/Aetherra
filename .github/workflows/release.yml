name: Release

on:
  workflow_run:
    workflows: [CI Quality Gates]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  discussions: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    # A green PR or unsigned/skipped build is never a release authorization.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Require signed CI for this main commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA" || { echo '::error::Main advanced; wait for its signed build.'; exit 1; }
          python tools/verify_release_ci.py --repo "$GITHUB_REPOSITORY" --sha "$RELEASE_SHA"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install .[dev]
          pip install -r requirements/quality.txt python-semantic-release==9.21.1 build pynacl

      - name: Quick quality (lint + minimal test)
        run: |
          pwsh tools/quick_quality_check.ps1

      - name: Upload quick quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-quality
          path: |
            parse_baseline_sample.json
            wf_sample.json
            wf_sample.md
          if-no-files-found: ignore

      - name: Security audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit || true

      - name: Semantic Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AETHERRA_RELEASE_PRIVKEY: ${{ secrets.AETHERRA_RELEASE_PRIVKEY }}
        run: |
          python tools/run_release.py

      - name: Format changelog
        if: always()
        run: |
          if [ -f CHANGELOG.md ]; then python tools/format_changelog.py || true; fi
