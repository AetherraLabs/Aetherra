name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish as a GitHub Release'
        required: true
      notes_file:
        description: 'Optional path to release notes file (defaults to docs/RELEASE_NOTES_<tag>.md)'
        required: false

jobs:
  create-release:
    # Skip provenance / auxiliary tags (e.g. v0.1.0-alpha.2-provenance) to avoid duplicate Releases
    if: >-
      (github.event_name == 'push' && !endsWith(github.ref_name, '-provenance')) ||
      (github.event_name == 'workflow_dispatch' && !endsWith(github.event.inputs.tag, '-provenance'))
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag & notes path
        id: meta
        shell: bash
        run: |
          RAW_INPUT="${{ github.event.inputs.tag }}"
          if [ -n "$RAW_INPUT" ]; then
            TAG="$RAW_INPUT"
          else
            TAG="${GITHUB_REF_NAME}"  # from push tag event
          fi
          # Strip refs/tags/ prefix if present
          TAG="${TAG#refs/tags/}"
          # If the user pasted extra words (e.g. 'tag: v0.1.0-alpha.2 notes_file: X'), extract first token that looks like a tag
          if [[ "$TAG" == *" "* ]]; then
            for tok in $TAG; do
              if [[ $tok =~ ^v[0-9].* ]]; then TAG="$tok"; break; fi
            done
          fi
          # Basic validation (alnum, dots, dashes, v prefix)
            if [[ ! $TAG =~ ^v[0-9A-Za-z._-]+$ ]]; then
              echo "::error::Sanitized tag '$TAG' is not a valid release tag format"; exit 1;
            fi
          git fetch --tags --quiet
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag '$TAG' does not exist in repository"; exit 1;
          fi
          # Determine notes file
          if [ -n "${{ github.event.inputs.notes_file }}" ]; then
             CANDIDATE="${{ github.event.inputs.notes_file }}"
          else
             CANDIDATE="docs/RELEASE_NOTES_${TAG}.md"
          fi
          if [ -f "$CANDIDATE" ]; then
             echo "notes_path=$CANDIDATE" >> "$GITHUB_OUTPUT"
          else
             echo "notes_path=" >> "$GITHUB_OUTPUT"
             echo "::warning::Release notes file not found ($CANDIDATE). Using auto-generated body."
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create / Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Aetherra ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: true
          body_path: ${{ steps.meta.outputs.notes_path }}
          body: |-
            Aetherra ${{ steps.meta.outputs.tag }} (auto-generated summary)
            If you expected detailed notes, add docs/RELEASE_NOTES_${{ steps.meta.outputs.tag }}.md and re-run via workflow_dispatch.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach integrity manifest (optional)
        if: ${{ steps.meta.outputs.notes_path != '' && hashFiles('integrity_manifest.json') != '' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            integrity_manifest.json
            sbom.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
