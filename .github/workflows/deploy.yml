name: Deploy Aetherra to GitHub Pages

on:
  push:
    branches: [ main ]
    paths: [
      'web/aetherra-website/**',
      'docs/**',
      '.github/workflows/deploy.yml'
    ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'web/aetherra-website/package-lock.json'

      - name: Install Dependencies
        working-directory: web/aetherra-website
        run: npm ci

      - name: Build Website
        working-directory: web/aetherra-website
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
