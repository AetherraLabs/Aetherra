name: Aether Script Signatures

on:
  pull_request:
    paths:
      - '**/*.aether'
      - 'tools/verify_aether_scripts.py'
      - '.github/workflows/aether-verify-signatures.yml'
  push:
    branches: [ main ]
    paths:
      - '**/*.aether'
      - 'tools/verify_aether_scripts.py'

jobs:
  verify-aether:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install .; fi
      - name: Verify .aether signatures (strict)
        env:
          AETHERRA_SCRIPT_VERIFY_STRICT: '1'
          AETHERRA_PROFILE: test
        run: |
          python tools/verify_aether_scripts.py --root . --strict --profile test
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-static-report
          path: aether_static_report.md
