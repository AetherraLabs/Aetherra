name: "🚀 Production Readiness Checks"

on:
  workflow_dispatch:

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify minimal runtime files
        run: |
          test -f Aetherra/runtime_ui/__init__.py
          test -f aetherra_hub/blueprints/runtime_ui.py
          test -f .env.example

      - name: 📦 Upload .env.example
        uses: actions/upload-artifact@v4
        with:
          name: env-example
          path: .env.example
