name: Security Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  bandit-and-pip-audit:
    name: Bandit + pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit bandit-sarif-formatter || pip install bandit pip-audit

      - name: Bandit (Python security lints)
        run: |
          # Run Bandit with SARIF output (requires bandit-sarif-formatter). Fallback creates minimal SARIF stub.
          set -e
          if bandit -r Aetherra -f sarif -o bandit.sarif; then
            echo "Bandit SARIF generated"
          else
            echo "Bandit SARIF generation failed; creating stub" >&2 || true
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0","runs":[{"tool":{"driver":{"name":"Bandit","informationUri":"https://bandit.readthedocs.io/","rules":[]}},"results":[]}]}' > bandit.sarif
          fi
          ls -l bandit.sarif || true

      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif

      - name: pip-audit (dependency vulnerabilities)
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt -f sarif -o pipaudit.sarif || true
          else
            pip-audit -f sarif -o pipaudit.sarif || true
          fi
          if [ ! -s pipaudit.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0","runs":[{"tool":{"driver":{"name":"pip-audit","informationUri":"https://pypi.org/project/pip-audit/","rules":[]}},"results":[]}]}' > pipaudit.sarif
          fi

      - name: Upload pip-audit SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: pipaudit.sarif
