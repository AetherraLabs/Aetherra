name: Semantic Release Dry Run

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install .[dev]
      - name: Semantic release dry-run
        id: semrel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          semantic-release print-version --current || true
          semantic-release version --noop --skip-build --skip-changelog || true
          semantic-release changelog --noop || true
      - name: Determine next version
        id: next
        run: |
          nv=$(semantic-release version --noop --print | tail -n1 || echo unknown)
          echo "next=$nv" >> $GITHUB_OUTPUT
      - name: Post PR comment
        if: ${{ github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          recreate: true
          message: |
            ### Semantic Release Dry Run
            Proposed next version: `${{ steps.next.outputs.next }}`
            (Based on Conventional Commits in this PR + main)
