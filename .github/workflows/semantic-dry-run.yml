name: Semantic Release Dry Run

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install .[dev]
          pip install python-semantic-release==9.21.1 pynacl
      - name: Test release bootstrap with real Git and CLI
        run: python -m pytest tests/tools/test_release_bootstrap.py -q -o addopts=
      - name: Semantic release dry-run
        id: next
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Evaluate the PR merge checkout under the actual main release policy.
          git checkout -B main
          nv=$(python tools/run_release.py --plan)
          echo "next=$nv" >> "$GITHUB_OUTPUT"
      - name: Post PR comment
        if: ${{ github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          recreate: true
          message: |
            ### Semantic Release Dry Run
            Proposed next version: `${{ steps.next.outputs.next }}`
            (Based on Conventional Commits in this PR + main)
