name: Nightly Parse & Classification Diff

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  nightly-parse-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps (minimal)
        run: |
          python -m pip install --upgrade pip
          pip install jq

      - name: Full parse baseline
        run: |
          python tools/generate_parse_baseline.py --output parse_baseline_full.json || true
          jq '.by_code' parse_baseline_full.json || true

      - name: Fast sample baseline
        run: |
          python tools/generate_parse_baseline.py --limit 60 --output parse_baseline_sample.json || true
          jq '.by_code' parse_baseline_sample.json || true

      - name: Classification sample
        run: |
          python tools/classify_aether_workflow_failures.py --limit 120 --output workflow_failures_sample.json --markdown workflow_failures_sample.md || true

      - name: Diff summary
        run: |
          echo '### Nightly Parse & Classification Diff' >> $GITHUB_STEP_SUMMARY
          if [ -f parse_baseline_full.json ]; then echo '#### Full Baseline' >> $GITHUB_STEP_SUMMARY; jq '.by_code' parse_baseline_full.json >> $GITHUB_STEP_SUMMARY; fi
          if [ -f parse_baseline_sample.json ]; then echo '\n#### Sample Baseline (limit 60)' >> $GITHUB_STEP_SUMMARY; jq '.by_code' parse_baseline_sample.json >> $GITHUB_STEP_SUMMARY; fi
          if [ -f workflow_failures_sample.json ]; then echo '\n#### Classification Sample' >> $GITHUB_STEP_SUMMARY; jq '.summary.categories' workflow_failures_sample.json >> $GITHUB_STEP_SUMMARY; fi
          echo '\n_Use this difference to watch structural drift or sudden spikes in parse/validation errors._' >> $GITHUB_STEP_SUMMARY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-parse-diff-artifacts
          path: |
            parse_baseline_full.json
            parse_baseline_sample.json
            workflow_failures_sample.json
            workflow_failures_sample.md
          if-no-files-found: ignore
