name: Aether Risk Badge

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.aether'
      - 'tools/generate_risk_badge.py'
  workflow_dispatch:

jobs:
  risk-badge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install .; fi
      - name: Generate risk badge
        run: |
          python tools/generate_risk_badge.py
      - name: Commit badge if changed
        run: |
          if git diff --quiet badge/aether_risk.json; then
            echo "No badge changes"
          else
            git config user.name 'aether-bot'
            git config user.email 'bot@aetherra.local'
            git add badge/aether_risk.json
            git commit -m 'chore: update aether risk badge'
            git push
          fi
      - name: Show badge JSON
        run: cat badge/aether_risk.json
