name: CI

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      AETHERRA_QUIET: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Smoke tests
        run: python tools/os_smoke.py

      - name: Capabilities tests
        run: pytest -q -o addopts= tests/capabilities

      - name: SSE v2 tests
        run: pytest -q -o addopts= tests/test_sse_v2.py

      - name: Docs consistency
        run: python tools/verify_docs_consistency.py

      - name: Spec→Tests Gate
        run: python tools/spec_tests_gate.py
name: "🧠 Aetherra Continuous Integration"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-consistency:
    name: "📚 Docs consistency"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4
      - name: "🐍 Set up Python 3.11"
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: "📦 Install minimal deps"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
      - name: "🔎 Run docs consistency verifier"
        run: |
          python tools/verify_docs_consistency.py
      - name: "📤 Upload report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-consistency-report
          path: docs/DOCS_CONSISTENCY_REPORT.md
  code-quality:
    name: "🔍 Code Quality Analysis"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "🐍 Set up Python 3.11"
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: "[TOOL] Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort pytest
          # Install minimal requirements for CI testing
          if [ -f requirements/ci.txt ]; then
            echo "Installing CI requirements..."
            pip install -r requirements/ci.txt || echo "CI requirements install failed"
          elif [ -f requirements/base.txt ]; then
            echo "Installing base requirements..."
            pip install -r requirements/base.txt || echo "Base requirements install failed"
          else
            echo "No requirements file found, continuing with basic tools"
          fi

      - name: "🎨 Format check with Black (relaxed)"
        run: |
          echo "🎨 Checking code formatting..."
          black --check --diff *.py Aetherra/ scripts/ --exclude="unused*|backup*|archive*|__pycache__" || echo "Formatting issues found but continuing..."

      - name: "📏 Import sorting with isort (relaxed)"
        run: |
          echo "📏 Checking import sorting..."
          isort --check-only --diff *.py Aetherra/ scripts/ --skip-glob="*/unused*/*" --skip-glob="*/backup*/*" --skip-glob="*/__pycache__/*" || echo "Import sorting issues found but continuing..."

      - name: "🔍 Basic linting"
        run: |
          echo "🔍 Running basic code quality checks..."
          flake8 *.py Aetherra/ scripts/ --count --max-line-length=150 --exclude=unused*,backup*,__pycache__ --exit-zero || echo "Linting completed with warnings"

  syntax-validation:
    name: "🔍 Syntax Validation"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "🐍 Set up Python 3.11"
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: "[TOOL] Validate Python syntax"
        run: |
          echo "🔍 Checking Python syntax..."
          find . -name "*.py" -not -path "./unused*/*" -not -path "./.venv/*" | head -15 | while read file; do
            python -m py_compile "$file" && echo "✅ $file" || echo "❌ $file has syntax errors"
          done

      - name: "📋 Project validation"
        run: |
          echo "📋 Project structure validation..."
          echo "Root Python files:" && ls *.py | head -3 || true
          echo "Aetherra directory:" && ls -la Aetherra/ | head -3 || echo "Aetherra directory check failed"
          echo "Scripts directory:" && ls -la scripts/ | head -3 || echo "Scripts directory check failed"
          echo "Requirements files:" && ls requirements* || echo "Requirements check failed"
          echo "🎉 Basic validation completed"

      - name: "🗺️ Import map validator"
        run: |
          python tools/validate_import_map.py

  import-discipline:
    name: "🧭 Import Discipline Gate"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4
      - name: "🐍 Set up Python 3.11"
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: "📦 Install minimal deps"
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: "🧪 Run import validator (legacy + deep relative)"
        run: |
          python tools/validate_import_map.py
      - name: "🔍 Ruff banned modules check"
        run: |
          ruff check --select TID252 . || true

  runtime-ui-smoke:
    name: "Runtime UI smoke"
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: "📦 Install minimal deps"
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: "Runtime UI read-only snapshot"
        run: |
          python - <<'PY'
          from Aetherra.runtime_ui import (
              build_runtime_ui_bootstrap_payload,
              parse_observatory_mode,
          )

          mode = parse_observatory_mode("overview")
          assert mode is not None
          payload = build_runtime_ui_bootstrap_payload(
              mode=mode,
              user_name="CI",
              limit=5,
          )
          assert payload["ok"] is True
          assert payload["read_only"] is True
          assert payload["observatory"]["mode"] == "overview"
          assert payload["manifest"]["authority"]["approve"] == "guardian"
          PY

  lyrixa-gui-import:
    name: "🧪 Lyrixa GUI import smoke"
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
      - name: "🐍 Setup Python"
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: "📦 Install deps (with offscreen Qt)"
        run: |
          python -m pip install --upgrade pip
          pip install requests flask flask-socketio PySide6 pytest
      - name: "🔎 Run Lyrixa GUI smoke test (offscreen)"
        run: |
          export QT_QPA_PLATFORM=offscreen
          python -m pytest -q tests/unit/test_gui_smoke.py

  aether-tests:
    name: "🧪 Aether script basic tests"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
      - name: "🐍 Setup Python"
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: "📦 Install pytest"
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: "🏃 Run basic aether script test"
        run: |
          pytest -q tests/test_aether_script_basic.py

  signing-tests:
    name: "🔐 Signing & Discovery tests"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
      - name: "🐍 Setup Python"
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: "📦 Install deps (Flask, Requests, PyNaCl, pytest)"
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests flask pynacl
      - name: "🔧 Set env flags"
        run: |
          echo "AETHERRA_SIGN_PLUGINS=1" >> $GITHUB_ENV
          echo "AETHERRA_SIGNING_STRICT=1" >> $GITHUB_ENV
      - name: "🏃 Run signing tests (hub + discovery)"
        run: |
          # Soften warnings if project addopts is strict
          pytest -q -W ignore::Warning tests/test_hub_signing.py tests/test_discovery_signing.py

  lyrixa-tasks:
    name: "🔁 Lyrixa tasks present"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
      - name: "🔎 Verify tasks exist"
        run: |
          test -f Aetherra/lyrixa/lyrixa_basic.py && echo "✅ Lyrixa Basic GUI present" || (echo "❌ Missing Lyrixa Basic GUI"; exit 1)
          test -f Aetherra/lyrixa/launcher.py && echo "✅ Lyrixa backend launcher present" || (echo "❌ Missing Lyrixa backend launcher"; exit 1)

  quality-gates:
    name: "✅ Quality Gates (strict + arch verifier)"
    runs-on: ubuntu-latest
    env:
      ARCH_CHECK: '1'
      ARCH_CHECK_STRICT: '1'
      ARCH_PROBE_HUB: '1'
      # Keep coverage threshold flexible; no-drop is handled inside the script
      MIN_COVERAGE: '0'
    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "🐍 Set up Python 3.11"
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: "📦 Install test deps"
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov requests flask
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi

      - name: "🚦 Run Quality Gates"
        run: |
          python tools/quality_gates.py

  ws-transport-tests:
    name: "🌐 WS transport tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4
      - name: "🐍 Set up Python 3.11"
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: "📦 Install deps (CI + runtime)"
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements/ci.txt ]; then pip install -r requirements/ci.txt; fi
          # Ensure runtime stack for Flask-Sock
          pip install flask simple-websocket websockets pytest
      - name: "� Set env flags for WS"
        run: |
          echo "AETHERRA_AI_API_ENABLED=1" >> $GITHUB_ENV
          echo "AETHERRA_AI_API_STREAM=1" >> $GITHUB_ENV
          echo "AETHERRA_AI_API_WS=1" >> $GITHUB_ENV
          echo "AETHERRA_IDEMPOTENCY_ENFORCE=1" >> $GITHUB_ENV
      - name: "🏃 Run WS tests"
        run: |
          pytest -q tests/unit/test_ws_idempotency.py

  metrics-reference-sync:
    name: "📊 Metrics reference sync"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4
      - name: "🐍 Set up Python 3.11"
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: "📦 Install minimal deps"
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements/ci.txt ]; then pip install -r requirements/ci.txt || true; fi
          pip install flask
      - name: "� Regenerate metrics reference"
        run: |
          python tools/generate_metrics_reference.py --out docs/METRICS_REFERENCE.md
      - name: "🔍 Diff check"
        run: |
          git diff --exit-code docs/METRICS_REFERENCE.md || (echo "❌ Metrics reference out of date. Run: python tools/generate_metrics_reference.py --out docs/METRICS_REFERENCE.md" && exit 1)
