name: Packaging Check

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build sdist and wheel
        run: |
          python -m build
      - name: Twine check
        run: |
          python -m twine check dist/*
      - name: License consistency (warn-only)
        run: |
          python tools/check_license_consistency.py --warn || true
