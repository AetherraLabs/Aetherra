name: Fast Quality Gate

on:
  push:
    paths:
      - '**/*.py'
      - '**/*.aether'
      - 'pyproject.toml'
      - 'Aetherra/pyproject.toml'
      - '.pre-commit-config.yaml'
      - 'tools/quick_quality_check.ps1'
  pull_request:
    paths:
      - '**/*.py'
      - '**/*.aether'
      - 'pyproject.toml'
      - 'Aetherra/pyproject.toml'
      - '.pre-commit-config.yaml'
      - 'tools/quick_quality_check.ps1'

jobs:
  fast-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache deps & tool caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            .ruff_cache
            .mypy_cache
          key: fast-q-${{ runner.os }}-${{ hashFiles('**/requirements*.txt') }}-${{ hashFiles('pyproject.toml','Aetherra/pyproject.toml') }}
          restore-keys: |
            fast-q-${{ runner.os }}-

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort pytest jq

      - name: Quick lint/format/test
        run: |
          echo '--- Ruff lint'
          ruff check .
          echo '--- Ruff format check'
          ruff format --check .
          echo '--- Black check'
          black --line-length 100 --check . || (echo 'Black failed' && exit 1)
          echo '--- isort check'
          isort --profile black --line-length 100 --check-only .
          echo '--- Minimal pytest'
          if [ -f tests/capabilities/test_lyrixa_chat_bridge_schema.py ]; then pytest -q -o addopts= tests/capabilities/test_lyrixa_chat_bridge_schema.py::test_edit_plan_mirrors_suggestions_and_confidence_defaults; fi

      - name: Sample parse baseline (non-blocking)
        run: |
          python tools/generate_parse_baseline.py --limit 30 --output parse_baseline_fast.json || true
          cat parse_baseline_fast.json || true

      - name: Workflow classifier sample (non-blocking)
        run: |
          python tools/classify_aether_workflow_failures.py --limit 30 --output wf_fast.json --markdown wf_fast.md || true
          head -n 80 wf_fast.md || true

      - name: GitHub summary
        if: always()
        run: |
          echo "### Fast Quality Gate Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f parse_baseline_fast.json ]; then echo "#### Parse Baseline Sample" >> $GITHUB_STEP_SUMMARY; jq '.by_code' parse_baseline_fast.json >> $GITHUB_STEP_SUMMARY; fi
          if [ -f wf_fast.json ]; then echo "\n#### Workflow Classification Sample" >> $GITHUB_STEP_SUMMARY; jq '.summary.categories' wf_fast.json | head -n 60 >> $GITHUB_STEP_SUMMARY; fi
          echo "\n_This gate is advisory; failures here should be addressed before full quality gates._" >> $GITHUB_STEP_SUMMARY

      - name: Upload baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: parse-baseline-fast
          path: parse_baseline_fast.json
          if-no-files-found: ignore

      - name: Upload classifier artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-classifier-fast
          path: |
            wf_fast.json
            wf_fast.md
          if-no-files-found: ignore
