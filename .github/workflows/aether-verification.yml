name: Aether Script Verification

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  verify-aether-scripts:
    name: Verify .aether Script Signatures
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify .aether script signatures (strict mode)
        env:
          AETHERRA_SCRIPT_VERIFY_STRICT: '1'
          AETHERRA_PROFILE: 'test'
        run: |
          python tools/verify_aether_scripts.py \
            --strict \
            --root . \
            --output aether_verification_report.md \
            --fail-on-any-risk

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aether-verification-report
          path: aether_verification_report.md
          retention-days: 30

      - name: Check for high-risk scripts
        if: failure()
        run: |
          echo "::error::Aether script verification failed. Check the verification report artifact for details."
          echo "Failed scripts may have invalid signatures or high static risk scores."
          cat aether_verification_report.md
          exit 1

  system-readiness-check:
    name: System Readiness Validation
    runs-on: ubuntu-latest
    needs: verify-aether-scripts
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run system readiness script
        env:
          AETHERRA_PROFILE: 'test'
          AETHERRA_SCRIPT_VERIFY_STRICT: '1'
        run: |
          python aether.py workflows/system_readiness.aether

      - name: Check readiness exit code
        if: failure()
        run: |
          echo "::error::System readiness check failed. Engine, memory, metrics, or script verification failed."
          exit 1
