name: Deploy Aetherra Website to GitHub Pages

on:
  push:
    branches:
      - "main"
      - "feat/federation-signing-telemetry"
    paths:
      - 'aetherra-website/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'aetherra-website/package-lock.json'

      - name: Install dependencies
        working-directory: 'aetherra-website'
        run: npm ci

      - name: Build website (to docs)
        working-directory: 'aetherra-website'
        run: npm run build

      # CNAME is bundled from public/ into dist by Vite

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
