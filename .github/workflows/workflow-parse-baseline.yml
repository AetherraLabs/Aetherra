name: Aether Parse Baseline

on:
  push:
    paths:
      - '**/*.aether'
      - 'aether.py'
      - 'tools/generate_parse_baseline.py'
      - '.github/workflows/workflow-parse-baseline.yml'
  pull_request:
    paths:
      - '**/*.aether'
      - 'aether.py'
      - 'tools/generate_parse_baseline.py'

jobs:
  parse-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Generate parse baseline
        env:
          AETHERRA_PROFILE: test
          AETHERRA_QUIET: '1'
        run: |
          python tools/generate_parse_baseline.py --output parse_baseline.json --limit 0

      - name: Upload baseline artifact
        uses: actions/upload-artifact@v7
        with:
          name: parse-baseline
          path: parse_baseline.json
          if-no-files-found: error
