name: CI Quality Gates
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        env:
          LOCK_FILE: requirements-ci.lock
        run: |
          python -m pip install --upgrade pip
          if [ -f "$LOCK_FILE" ]; then
            pip install -r "$LOCK_FILE"
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
            pip install pytest pytest-cov prometheus-client pyyaml
          fi
      - name: Version badge check
        run: python tools/verify_version_badge.py
      - name: Generate license report
        env:
          LOCK_FILE: requirements-ci.lock
        run: |
          python tools/license_report.py --lock "$LOCK_FILE" --json licenses_report.json || true
      - name: Run quality gates
        env:
          PACKAGE_SMOKE: '1'
          SBOM_GENERATE: '1'
          PUBLISH_ARTIFACTS: '1'
          TEST_TARGETS: 'tests/capabilities tests/unit tests/integration'
          LOCK_FILE: requirements-ci.lock
          LOCK_ENFORCE: '1'
          VULN_SCAN: ${{ github.event_name == 'push' && '1' || '0' }}
        run: python tools/quality_gates.py
      - name: Validate overrides schema
        run: python tools/validate_license_overrides.py --file license_overrides.yml || true
      - name: Integrity manifest
        run: python tools/generate_integrity_manifest.py --dist dist --out integrity-manifest.json || true
      - name: Publish artifacts
        uses: actions/upload-artifact@v7
        with:
          name: quality-gates-artifacts
          path: |
            artifacts
            integrity-manifest.json
            licenses_report.json
            sbom.json

      - name: Production bundle with signed release manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          AETHERRA_RELEASE_PRIVKEY: ${{ secrets['AETHERRA_RELEASE_PRIVKEY'] }}
        run: |
          python tools/verify_phase5_manifest_policy.py --require-env-var AETHERRA_RELEASE_PRIVKEY
          pip install pynacl
          python tools/phase5_bundle_artifacts.py \
            --profile full \
            --runs 1 \
            --timeout 180 \
            --min-run-pass-rate 1.0 \
            --emit-release-manifest \
            --release-manifest-version ci-production-${{ github.sha }} \
            --output-dir .aetherra/reports/phase5 \
            --stamp ci_prod_manifest

      - name: Enforce signed-manifest policy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python tools/verify_phase5_manifest_policy.py \
            --summary .aetherra/reports/phase5/phase5_bundle_ci_prod_manifest.json \
            --require-signature
