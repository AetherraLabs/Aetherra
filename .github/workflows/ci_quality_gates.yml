name: CI Quality Gates
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install deps
        env:
          LOCK_FILE: requirements-ci.lock
        run: |
          python -m pip install --upgrade pip
          if [ -f "$LOCK_FILE" ]; then
            pip install -r "$LOCK_FILE"
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
            pip install pytest pytest-cov prometheus-client pyyaml
          fi
      - name: Install isolated vulnerability tooling
        run: |
          audit_env="$RUNNER_TEMP/aetherra-vulnerability-tools"
          python -m venv "$audit_env"
          "$audit_env/bin/python" -m pip install 'pip-audit==2.10.1'
          audit_bin=$(mktemp -d "$RUNNER_TEMP/aetherra-audit-bin.XXXXXX")
          ln -s "$audit_env/bin/pip-audit" "$audit_bin/pip-audit"
          echo "$audit_bin" >> "$GITHUB_PATH"
      - name: Provision pinned continuity embedding model
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          python - <<'PY'
          from sentence_transformers import SentenceTransformer
          from Aetherra.aetherra_core.memory.chat_retrieval import MODEL, REVISION

          SentenceTransformer(MODEL, revision=REVISION, device="cpu", trust_remote_code=False)
          PY
      - name: Offline personal continuity checks
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        # Run the complete restart acceptance cases explicitly; the main suite
        # also runs retrieval unit tests and appends this coverage.
        run: >-
          python -m pytest tests/acceptance/test_personal_continuity.py -q -o addopts=
          --cov=. --cov-report= --cov-fail-under=0
      - name: Release signing and bundle regression tests
        run: >-
          python -m pytest tests/tools/test_release_signing.py
          tests/legacy/root_standalone/test_hub_blueprints_standalone.py
          tests/legacy/root_standalone/test_policy_manager_standalone.py
          tests/legacy/root_standalone/test_phase5_validation_harness_standalone.py
          -q -o addopts=
          --cov=. --cov-append --cov-report= --cov-fail-under=0
      - name: Vulnerability and quality gate regression tests
        run: >-
          python -m pytest tests/tools/test_vuln_scan.py
          tests/tools/test_quality_gates_pr_description.py
          tests/tools/test_quality_gate_controls.py
          tests/tools/test_enforce_lock_sync.py
          -q -o addopts=
          --cov=. --cov-append --cov-report= --cov-fail-under=0
      - name: Version badge check
        run: python tools/verify_version_badge.py
      - name: Generate license report
        env:
          LOCK_FILE: requirements-ci.lock
        run: |
          python tools/license_report.py --lock "$LOCK_FILE" --json licenses_report.json || true
      - name: Run quality gates
        env:
          PACKAGE_SMOKE: '1'
          SBOM_GENERATE: '1'
          PUBLISH_ARTIFACTS: '1'
          TEST_TARGETS: 'tests/capabilities tests/unit tests/integration'
          PYTEST_ADDOPTS: '--cov-append'
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          LOCK_FILE: requirements-ci.lock
          LOCK_ENFORCE: '1'
          VULN_SCAN: '1'
        run: python tools/quality_gates.py
      - name: Validate overrides schema
        run: python tools/validate_license_overrides.py --file license_overrides.yml || true
      - name: Integrity manifest
        run: python tools/generate_integrity_manifest.py --dist dist --out integrity-manifest.json || true
      - name: Publish artifacts
        uses: actions/upload-artifact@v7
        with:
          name: quality-gates-artifacts
          path: |
            artifacts
            integrity-manifest.json
            licenses_report.json
            sbom.json

      - name: Production bundle with signed release manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          AETHERRA_RELEASE_PRIVKEY: ${{ secrets['AETHERRA_RELEASE_PRIVKEY'] }}
        run: |
          if [ -z "$AETHERRA_RELEASE_PRIVKEY" ]; then
            echo "::error::Configure the AETHERRA_RELEASE_PRIVKEY Actions secret with the approved 64-character Ed25519 private seed. Unsigned production releases are forbidden."
            exit 1
          fi
          python tools/verify_phase5_manifest_policy.py --require-env-var AETHERRA_RELEASE_PRIVKEY
          pip install pynacl
          python tools/phase5_bundle_artifacts.py \
            --profile full \
            --runs 1 \
            --timeout 180 \
            --min-run-pass-rate 1.0 \
            --emit-release-manifest \
            --release-manifest-version ci-production-${{ github.sha }} \
            --output-dir .aetherra/reports/phase5 \
            --stamp ci_prod_manifest

      - name: Enforce signed-manifest policy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python tools/verify_phase5_manifest_policy.py \
            --summary .aetherra/reports/phase5/phase5_bundle_ci_prod_manifest.json \
            --require-signature
          python tools/verify_release_manifest.py \
            --manifest .aetherra/reports/phase5/phase5_release_manifest_ci_prod_manifest.json \
            --dist .aetherra/reports/phase5 \
            --pubkey "$(cat keys/release_signing_ed25519.pub)"
