name: Deploy / Debug (Ad-hoc)

on:
  workflow_dispatch:
    inputs:
      build_site:
        description: 'Build aetherra-website (true/false)'
        required: false
        default: 'true'
      include_python_env:
        description: 'Capture Python env details (pip freeze)'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Basic Repo State
        run: |
          echo "Branch: $GITHUB_REF" > DEBUG_INFO.txt
          echo "SHA: $GITHUB_SHA" >> DEBUG_INFO.txt
          echo "Date: $(date -u)" >> DEBUG_INFO.txt
          echo "Top commits:" >> DEBUG_INFO.txt
          git --no-pager log -n 5 --oneline >> DEBUG_INFO.txt

      - name: Node Setup
        if: ${{ inputs.build_site == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aetherra-website/package-lock.json

      - name: Install & Build Site
        if: ${{ inputs.build_site == 'true' }}
        working-directory: aetherra-website
        run: |
          npm ci || npm install
          npm run build || (echo "Build failed" && exit 1)

      - name: Capture Python Env
        if: ${{ inputs.include_python_env == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python Env Snapshot
        if: ${{ inputs.include_python_env == 'true' }}
        run: |
          python -V > PY_ENV.txt
          pip list >> PY_ENV.txt || true

      - name: Archive Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: |
            DEBUG_INFO.txt
            PY_ENV.txt
            docs/**
          if-no-files-found: warn

      - name: Summary
        run: |
          echo "### Debug Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "Site Build: ${{ inputs.build_site }}" >> $GITHUB_STEP_SUMMARY
          echo "Python Env: ${{ inputs.include_python_env }}" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts: debug-artifacts" >> $GITHUB_STEP_SUMMARY
