# Aetherra Pre-commit Configuration
# Ensures code quality before commits

repos:
  # Aetherra-specific hooks
  - repo: local
    hooks:
      - id: aether-sign
        name: Aether: Sign .aether files
        entry: python tools/precommit_sign_aether.py
        language: system
        pass_filenames: true
        files: \.aether$
      - id: aether-verify-strict
        name: Aether: Strict verification (.aether)
        entry: python tools/verify_aether_scripts.py --root . --output reports/aether_static_report.md --strict
        language: system
        pass_filenames: false
        stages: [commit]
      - id: block-runtime-artifacts
        name: Block committing runtime artifacts
        entry: python scripts/precommit_block_artifacts.py
        language: system
        pass_filenames: false
        stages: [commit]
      - id: block-legacy-hub-import
        name: Block deprecated aetherra_hub_server imports
        entry: python tools/precommit_block_legacy_hub.py
        language: system
        pass_filenames: false
        stages: [commit]
      - id: aetherra-banned-imports
        name: aetherra banned legacy imports check
        entry: ruff check --select TID251
        language: system
        types: [python]
        pass_filenames: true

  # Built-in hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(unused|backup|archive|reports)/
      - id: end-of-file-fixer
        exclude: ^(unused|backup|archive|reports)/
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Python code formatting
  - repo: https://github.com/psf/black
  rev: 24.4.2
    hooks:
      - id: black
        exclude: ^(unused|backup|archive)/
        args: [--line-length=120]

  # Import sorting
  - repo: https://github.com/pycqa/isort
  rev: 5.13.2
    hooks:
      - id: isort
        exclude: ^(unused|backup|archive)/
        args: [--profile=black, --line-length=120]

  # Linting
  - repo: https://github.com/pycqa/flake8
  rev: 7.1.1
    hooks:
      - id: flake8
        exclude: ^(unused|backup|archive)/
        args: [--max-line-length=120, --max-complexity=12, --ignore=E203,W503]

  # Security scanning
  - repo: https://github.com/PyCQA/bandit
  rev: 1.7.9
    hooks:
      - id: bandit
        exclude: ^(unused|backup|archive|tests)/
        args: [-ll]

  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.10.0
    hooks:
      - id: mypy
        exclude: ^(unused|backup|archive)/
        additional_dependencies: [types-requests, types-PyYAML]
        args: [--ignore-missing-imports, --no-strict-optional]

  # Dependency vulnerability checking
  - repo: https://github.com/Lucas-C/pre-commit-hooks-safety
    rev: v1.3.2
    hooks:
      - id: python-safety-dependencies-check
        files: requirements.*\.txt$

  # Documentation
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        exclude: ^(unused|backup|archive|tests)/
        args: [--convention=google]

  # Ruff (lint + extra rules) replaces part of flake8 scope gradually
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # Legacy banned import check using Ruff TID251 mapping to new namespaces
  - repo: local
    hooks:
      - id: aetherra-banned-imports
        name: aetherra banned legacy imports check
        entry: ruff check --select TID251
        language: system
        types: [python]
        pass_filenames: true

# Configuration
default_stages: [commit, push]
fail_fast: false

# Custom settings
ci:
  autofix_prs: true
  autoupdate_schedule: monthly
