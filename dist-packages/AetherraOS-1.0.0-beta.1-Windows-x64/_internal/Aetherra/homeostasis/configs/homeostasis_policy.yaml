# Aetherra Homeostasis Policy Configuration
#
# Defines safety guardrails, governance rules, and operational policies
# for the homeostasis system to ensure safe autonomous operation.
#
# SPDX-License-Identifier: GPL-3.0-or-later
# SPDX-FileCopyrightText: 2025 Aetherra Labs and Contributors

# Metadata
version: "1.0.0"
updated: "2025-10-12"
description: "Safety policies and governance rules for autonomous homeostasis operation"

# Safety Guardrails
safety_guardrails:
  # Critical System Boundaries
  never_exceed:
    # Learning rate boundaries to prevent instability
    max_learning_rate: 0.2
    min_learning_rate: 0.0001

    # Memory system limits
    max_memory_retry_budget: 10
    max_memory_timeout_multiplier: 5.0

    # Plugin system limits
    max_plugin_restart_rate: 5  # restarts per hour
    max_concurrent_plugin_operations: 3

    # Service restart limits
    max_service_restarts_per_hour: 3
    max_concurrent_service_restarts: 1

  # Protected Systems (never under homeostasis control)
  protected_systems:
    - "security_sandbox"      # Security sandbox hardening stays manual/CI
    - "authentication"        # Auth systems require manual oversight
    - "encryption_keys"       # Cryptographic material handling
    - "core_permissions"      # File system permissions
    - "network_security"      # Network security configuration

  # Emergency Stops
  emergency_conditions:
    # Conditions that immediately halt all homeostasis actions
    - condition: "memory_corruption_detected"
      action: "immediate_stop"
      alert_level: "critical"

    - condition: "security_breach_detected"
      action: "immediate_stop"
      alert_level: "critical"

    - condition: "cascading_service_failures"
      trigger: "more_than_3_services_failed_in_5_minutes"
      action: "pause_actions_15_minutes"
      alert_level: "high"

    - condition: "excessive_error_rate"
      trigger: "error_rate_10x_baseline_for_2_minutes"
      action: "switch_to_observe_only"
      alert_level: "high"

# Human Confirmation Requirements
human_confirmation:
  # Actions requiring human approval
  require_confirmation:
    - action_type: "destructive_multi_service_restart"
      description: "Restarting multiple core services simultaneously"
      timeout: 300  # seconds to wait for confirmation

    - action_type: "major_configuration_change"
      description: "Changing core system configuration"
      timeout: 600

    - action_type: "disable_critical_service"
      description: "Disabling services marked as critical"
      timeout: 180

    - action_type: "emergency_mode_activation"
      description: "Activating emergency operational mode"
      timeout: 120

  # Confirmation channels
  confirmation_channels:
    primary: "lyrixa_dashboard_notification"
    secondary: "system_log_alert"
    emergency: "console_output"

  # Automatic approval for routine actions
  auto_approve:
    - "plugin_timeout_adjustment"
    - "learning_rate_minor_tuning"
    - "memory_cache_optimization"
    - "non_critical_service_restart"

# Operational Policies
operational_policies:
  # Logging and Audit
  audit_requirements:
    log_all_actions: true
    log_all_decisions: true
    log_all_metric_readings: false  # too verbose
    log_policy_violations: true

    audit_retention: "30_days"
    critical_event_retention: "1_year"

  # Change Management
  change_control:
    # Staging requirements
    require_simulation_first: true
    simulation_duration: "5_minutes"

    # Rollback capability
    require_rollback_plan: true
    auto_rollback_on_failure: true
    rollback_timeout: 300  # seconds

    # Testing
    require_health_check_after_action: true
    health_check_timeout: 60  # seconds

  # Risk Management
  risk_levels:
    low_risk:
      actions: ["tune_parameters", "adjust_timeouts", "restart_single_plugin"]
      approval: "automatic"

    medium_risk:
      actions: ["restart_service", "change_operating_mode", "modify_memory_config"]
      approval: "automated_with_audit"

    high_risk:
      actions: ["multi_service_restart", "major_config_change", "emergency_mode"]
      approval: "human_confirmation_required"

    critical_risk:
      actions: ["disable_security_features", "modify_protected_systems"]
      approval: "always_denied"

# Governance Rules
governance:
  # Authority and Escalation
  decision_authority:
    routine_operations: "homeostasis_controller"
    operational_changes: "homeostasis_controller_with_audit"
    significant_changes: "human_operator"
    emergency_decisions: "human_operator_or_predefined_emergency_procedures"

  escalation_chain:
    level_1: "homeostasis_controller"
    level_2: "system_supervisor"
    level_3: "lyrixa_notification"
    level_4: "external_alert"

  # Oversight and Review
  review_requirements:
    daily_review: "automated_summary_report"
    weekly_review: "human_review_recommended"
    monthly_review: "human_review_required"

    incident_review: "immediate_human_review"
    trend_analysis: "weekly_automated_plus_monthly_human"

# Action Policies
action_policies:
  # Actuator-Specific Policies
  plugin_management:
    max_simultaneous_plugin_actions: 2
    require_health_check_before_restart: true
    blacklist_plugins: []  # plugins never to restart automatically
    critical_plugins: ["memory_system", "service_registry", "security_monitor"]

  memory_system:
    allow_automatic_timeout_adjustment: true
    max_timeout_increase_factor: 3.0
    allow_automatic_cache_tuning: true
    require_confirmation_for_storage_mode_change: true

  model_management:
    allow_automatic_fallback: true
    allow_automatic_model_switching: false  # requires human approval
    max_fallback_rate: 5  # fallbacks per hour

  service_orchestration:
    allow_automatic_service_restart: true
    critical_services_require_confirmation: true
    max_restart_cascade_depth: 2  # how many dependent services to restart

  # Timing Policies
  timing_constraints:
    min_time_between_similar_actions: 300  # seconds
    max_action_execution_time: 600  # seconds
    action_timeout: 300  # seconds

    # Batch action policies
    max_concurrent_actions: 3
    min_delay_between_batch_actions: 120  # seconds

# Monitoring and Compliance
compliance:
  # Metrics and KPIs
  success_metrics:
    mean_time_to_steady_state: 300  # seconds, target MTSS
    action_success_rate: 0.95  # 95% of actions should succeed
    false_positive_rate: 0.05  # max 5% unnecessary actions

  # Violation Handling
  policy_violations:
    minor_violation:
      action: "log_warning"
      escalation_time: 3600  # seconds

    major_violation:
      action: "pause_homeostasis_and_alert"
      escalation_time: 300  # seconds

    critical_violation:
      action: "immediate_stop_and_emergency_alert"
      escalation_time: 0  # immediate

  # Health Checks
  self_monitoring:
    check_policy_compliance: true
    check_safety_guardrails: true
    check_action_success_rates: true

    monitoring_interval: 60  # seconds
    report_interval: 3600  # seconds

# Integration Policies
integration:
  # External System Coordination
  lyrixa_integration:
    notify_lyrixa_of_actions: true
    request_lyrixa_input_for_major_decisions: true
    sync_operating_mode_with_lyrixa: true

  hub_coordination:
    sync_plugin_actions_with_hub: true
    report_system_health_to_hub: true
    coordinate_maintenance_windows: true

  # Data Sharing
  metrics_sharing:
    share_anonymized_metrics: true
    share_action_outcomes: true
    share_policy_compliance_data: true

    # Privacy protection
    exclude_sensitive_data: true
    encrypt_shared_metrics: true
