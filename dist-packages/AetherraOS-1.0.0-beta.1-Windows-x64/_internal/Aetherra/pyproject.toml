[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aetherra"
version = "0.5.0-beta.0"
description = "AI-Native Development Platform with Aetherra language and Lyrixa assistant"
authors = [
    {name = "Aetherra Development Team"}
]
license = {text = "GPL-3.0-or-later"}
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.7.0",
    "requests>=2.28.0",
    "pyyaml>=6.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "isort>=5.12.0",
    "ruff>=0.4.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
    "python-semantic-release>=9.0.0",
]
gui = [
    "PySide6>=6.4.0",
]
crypto = [
    "PyNaCl>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/aetherra/aetherra"
Repository = "https://github.com/aetherra/aetherra"
Documentation = "https://aetherra.readthedocs.io"

[project.scripts]
aetherra = "Aetherra.cli:main"
lyrixa = "Aetherra.ui.enhanced_lyrixa:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["Aetherra*"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100
combine_as_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    "venv",
    "build",
    "dist",
    "node_modules",
    # Short-term excludes: deprecated/inactive GUI modules pending refactor
    "gui/lyrixa_gui.py",
    "lyrixa/gui",
    "lyrixa/lyrixa_basic_gui.py",
    "lyrixa/plugins/*_ui.py",
    "plugins/extra_plugins/*_gui.py",
]

[tool.ruff.lint]
select = ["E","F","I","UP","B","SIM","Q"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/*.py" = ["UP006", "UP035", "UP045"]  # Temporary: ignore typing modernization while migrating
"Aetherra/aetherra_core/__init__.py" = ["F401"]
"Aetherra/aetherra_core/memory/lightweight_memory_core.py" = ["T201"]  # allow print in console demo
"aetherra_core/memory/lightweight_memory_core.py" = ["T201"]

[tool.ruff.lint.flake8-tidy-imports]
# Enforce migration away from legacy module namespaces
ban-relative-imports = "all"
banned-module-level-imports = [
    "aetherra_core",
    "lyrixa_core",
]


[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
warn_unreachable = false

[tool.python-semantic-release]
version_variable = ["Aetherra/__init__.py:__version__", "Aetherra/pyproject.toml:project.version"]
major_on_zero = false
branch = "main"
build_command = "python -m pip install build && python -m build"
changelog_file = "CHANGELOG.md"
upload_to_vcs_release = true
upload_to_repository = false
tag_format = "v{version}"
commit_parser = "angular"
prerelease_token = "beta"
allow_zero_version = true
assets = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
